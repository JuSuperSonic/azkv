[workspace]
resolver = "3"
members = ["crates/azkv-core", "crates/azkv-cli", "crates/azkv-tui"]

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = 'fat'
panic = 'abort'
codegen-units = 1

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
azure_core = "1.1.0"
azure_security_keyvault_secrets = "1.0.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "rustls", "socks", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
