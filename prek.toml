#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-toml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "check-added-large-files", args = [
    "--maxkb=1024",
  ] },
  { id = "mixed-line-ending", args = [
    "--fix=lf",
  ] },
  { id = "detect-private-key" },
]

[[repos]]
hooks = [
  { id = "format", name = "Cargo Format", entry = "cargo fmt", language = "system", pass_filenames = false },
  { id = "clippy", name = "Cargo Clippy", entry = "cargo clippy --all-targets --all-features --locked -- -D warnings", language = "system", pass_filenames = false },
  { id = "check", name = "Cargo Check", entry = "cargo check", language = "system", pass_filenames = false },
  { id = "audit", name = "Cargo Audit", entry = "cargo audit", language = "system", pass_filenames = false },
]
repo = "local"

[[repos]]
hooks = [
  { id = "conventional-pre-commit", stages = [
    "commit-msg",
  ], args = [
    "--strict",
    "feat",
    "fix",
    "perf",
    "refactor",
    "docs",
    "test",
    "build",
    "ci",
    "style",
    "chore",
    "revert",
  ] },
]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos]]
hooks = [{ id = "yamllint", args = ["--config-file=.yamllint.yaml"] }]
repo = "https://github.com/adrienverge/yamllint"
rev = "v1.38.0"
